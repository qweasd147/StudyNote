spring:
  application:
    name: PerformanceTest
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/test_schema
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      platform: init

logging:
  level:
    #org.hibernate: trace
    org.hibernate.event: trace
    #springframework.orm.jpa: trace
    #org.hibernate.type: TRACE
server:
  port: 8081